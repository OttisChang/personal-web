trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*

variables:
  acrName: 'acrjpeottisweb01'
  acrLoginServer: 'acrjpeottisweb01.azurecr.io'
  imageRepository: 'ottis-web-backend'
  containerAppName: 'aca-jpe-ottis-web-backend'
  resourceGroup: 'rg-ottis-web-01'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build & Push Docker Image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build and push image to ACR
      inputs:
        command: buildAndPush
        containerRegistry: 'ottis-web-acr-service-connection'
        repository: $(imageRepository)
        dockerfile: 'backend/Dockerfile'
        context: 'backend'
        tags: |
          $(tag)
          latest

    - bash: |
        echo "IMAGE_TAG=$(tag)" > $(Build.ArtifactStagingDirectory)/image-info.env
        echo "IMAGE_NAME=$(acrLoginServer)/$(imageRepository):$(tag)" >> $(Build.ArtifactStagingDirectory)/image-info.env
        cat $(Build.ArtifactStagingDirectory)/image-info.env
      displayName: Export image info for Release Pipeline

    - task: PublishBuildArtifacts@1
      displayName: Publish image info artifact
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/image-info.env'
        artifactName: imageInfo
